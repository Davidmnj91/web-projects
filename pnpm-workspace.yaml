    '@eslint/js': ^10.0.1
    '@next/eslint-plugin-next': ^16.3.4
    '@types/eslint-plugin-security': ^3.0.1
    '@typescript-eslint/utils': ^8.66.0
    eslint: ^10.8.1
    eslint-config-next: 16.3.4
    eslint-config-prettier: ^10.1.8
    eslint-plugin-astro: ^3.1.0
