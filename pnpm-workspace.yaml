packages:
  - root
  - apps/*
  - libs/*
  - config/*
  - tools/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

catalogMode: prefer

catalogs:
  astro:
    '@astrojs/sitemap': ^3.7.4
    '@astrojs/vercel': ^11.0.10
    astro: ^7.3.2
  cloudinary:
    cloudinary: ^2.11.0
  commit-hooks:
