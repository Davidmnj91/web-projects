    '@commitlint/cli': ^21.2.2
    '@commitlint/config-conventional': ^21.2.2
    '@commitlint/cz-commitlint': ^21.2.2
    commitizen: ^4.3.2
    husky: ^9.1.7
    lint-staged: ^17.5.1
  default:
    copyfiles: 2.4.1
    dotenv-cli: ^11.0.0
    npm-run-all2: ^9.0.3
    photoswipe: ^5.4.4
    rimraf: ^6.1.3
    turbo: ^2.10.12
  eslint:
