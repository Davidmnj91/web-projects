packages:
  - root
  - apps/*
  - libs/*
  - config/*
  - tools/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  cpu-features: true
  esbuild: true
  protobufjs: true
  sharp: true
  ssh2: true
  unrs-resolver: true

catalogMode: prefer

catalogs:
